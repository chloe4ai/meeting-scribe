name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app bundle
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      - name: Zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MeetingScribe.app MeetingScribe.zip
          shasum -a 256 MeetingScribe.zip | tee MeetingScribe.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe
          path: |
            dist/MeetingScribe.zip
            dist/MeetingScribe.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/MeetingScribe.zip dist/MeetingScribe.zip.sha256 \
            --title "MeetingScribe ${GITHUB_REF_NAME}" \
            --generate-notes
